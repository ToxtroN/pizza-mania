<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
		<title>Road Zombie Fight</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	overscroll-behavior: none;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	/* Yandex Games mobile rule: no long-tap text selection / context menu /
	   callout, no pinch-zoom or pull-to-refresh gestures fighting swipe
	   controls -- this, plus the contextmenu/touchstart JS guards below and
	   the viewport meta tag above, covers all of it. */
	touch-action: none;
	-webkit-user-select: none;
	-moz-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>

		<!-- Yandex Games SDK -- loaded and initialized independently of/in
		     parallel with the Godot engine below. Populates a few plain
		     window globals (__ysdk/__ysdkReady/__ysdkLang/__ysdkIsMobile)
		     that scripts/yandex_sdk.gd reads via JavaScriptBridge.eval();
		     see that file's doc comment for the full mapping and for why
		     this is hand-rolled rather than a third-party Godot addon. Every
		     call on the GDScript side already guards on window.__ysdk being
		     set, so it doesn't matter which finishes loading first, this
		     script or the engine. -->
		<script src="https://sdk.games.s3.yandex.net/sdk.js"></script>
		<script>
window.__ysdkReady = false;
window.__ysdkLang = 'ru';
window.__ysdkIsMobile = false;
if (typeof YaGames !== 'undefined') {
	YaGames.init().then(function (ysdk) {
		window.__ysdk = ysdk;
		window.__ysdkReady = true;
		try {
			window.__ysdkLang = ysdk.environment.i18n.lang || 'ru';
		} catch (e) { /* keep default */ }
		try {
			window.__ysdkIsMobile = ysdk.deviceInfo.isMobile();
		} catch (e) { /* keep default */ }
	}).catch(function (err) {
		// Missing/blocked SDK (e.g. testing this build outside Yandex
		// Games) must never break the game -- every yandex_sdk.gd call
		// already no-ops when window.__ysdk was never set, same as it
		// does off the Web export entirely.
		console.error('YaGames.init() failed:', err);
	});
} else {
	console.warn('Yandex Games SDK (sdk.js) did not load -- running without it.');
}

// Belt-and-suspenders alongside the CSS user-select/touch-callout rules
// above: explicitly swallow the two gesture types that most commonly leak
// through anyway (the system text-selection/context menu on a long
// press, and the two-finger/double-tap browser zoom that would otherwise
// fight the game's own swipe-to-change-lane gesture).
document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
		</script>

		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":34203600,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
